<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#18202a">
<meta name="description" content="一本写你的书：填下你的生辰和小时候陪你长大的人，走进二十四个小时，过完一生。">
<title>人生之书</title>
</head>
<body>
<button class="sound" id="sound" type="button" aria-pressed="true" hidden>声音 开</button>
<main class="stage" id="stage">
  <div class="book" id="book" aria-live="polite"></div>
</main>
<div class="appendix" id="appendix" hidden></div>
<div class="sheet" id="share-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-card">
    <p class="sheet-title" id="sheet-title">长按图片，保存到相册</p>
    <img id="share-img" alt="人生签图片">
    <button class="btn light" type="button" id="btn-sheet-close">关闭</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
