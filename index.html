<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>穿搭风格实验室 · 发现你的专属风格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Serif SC', serif; background: linear-gradient(135deg, #fef7f9 0%, #fdf2f8 25%, #fff5f7 50%, #fce7f3 75%, #fef1f5 100%); color: #1a1a1a; -webkit-tap-highlight-color: transparent; min-height: 100vh; overflow-x: hidden; }

        .app-wrap { background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,245,248,0.95) 40%, rgba(253,242,248,0.9) 100%); position: relative; overflow: hidden; }

        .app-wrap::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 20% 20%, rgba(236,72,153,0.08) 0%, transparent 40%), radial-gradient(circle at 80% 30%, rgba(168,85,247,0.06) 0%, transparent 40%), radial-gradient(circle at 40% 80%, rgba(244,114,182,0.06) 0%, transparent 40%); animation: bgFloat 25s ease-in-out infinite; pointer-events: none; }

        @keyframes bgFloat { 0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); } 25% { transform: translate(2%, 1%) rotate(0.5deg) scale(1.01); } 50% { transform: translate(-1%, 2%) rotate(-0.5deg) scale(1); } 75% { transform: translate(1%, -1%) rotate(0.3deg) scale(1.01); } }

        .card { background: rgba(255,255,255,.92); backdrop-filter: blur(24px); border-radius: 28px; border: 1px solid rgba(236,72,153,.12); box-shadow: 0 8px 40px rgba(236,72,153,.12), 0 2px 8px rgba(0,0,0,.04), inset 0 1px 0 rgba(255,255,255,.8); position: relative; overflow: hidden; transition: all .4s cubic-bezier(.4,0,.2,1); }

        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(236,72,153,.5), rgba(168,85,247,.5), transparent); }

        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 48px rgba(236,72,153,.18), 0 4px 12px rgba(0,0,0,.06); }

        .fade-up { animation: fadeUp .7s cubic-bezier(.4,0,.2,1) both; }
        .d1{animation-delay:.1s} .d2{animation-delay:.25s} .d3{animation-delay:.4s}

        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .italic-title { font-family: 'Playfair Display', serif; font-style: italic; }

        .hero-sym { font-family: 'Playfair Display', serif; font-style: italic; font-size: 72px; line-height: 1; background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #ec4899 100%); background-size: 200% 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: gradientShift 4s ease infinite; filter: drop-shadow(0 4px 8px rgba(236,72,153,.3)); }

        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .entry-tag { display: inline-block; padding: .3rem .9rem; border-radius: 999px; font-size: .72rem; letter-spacing: .15em; background: linear-gradient(135deg, rgba(236,72,153,.1), rgba(168,85,247,.1)); color: #a855f7; border: 1px solid rgba(168,85,247,.18); }

        .entry-btn { display: inline-flex; align-items: center; gap: .4rem; padding: .7rem 1.6rem; border-radius: 999px; font-size: .88rem; color: #fff; background: linear-gradient(135deg, #ec4899, #a855f7); box-shadow: 0 6px 20px rgba(236,72,153,.3); transition: all .3s cubic-bezier(.4,0,.2,1); }

        .entry-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(236,72,153,.4); }
    </style>
</head>
<body>
    <div class="app-wrap min-h-screen flex items-center justify-center px-5 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-10 fade-up d1">
                <div class="hero-sym mb-3">Style</div>
                <h1 class="text-2xl font-semibold tracking-wide">穿搭风格实验室</h1>
                <p class="italic-title text-sm mt-2" style="color:#a855f7;">Discover Your Unique Style</p>
                <p class="text-xs mt-3" style="color:#888;">选择一个工具，开始探索属于你的穿搭风格</p>
            </div>

            <a href="fengge.html" class="card block p-7 mb-5 fade-up d2 no-underline" style="color:inherit;">
                <span class="entry-tag mb-4">测评 · TEST</span>
                <h2 class="text-lg font-semibold mt-3">穿搭基因测评</h2>
                <p class="text-sm mt-2 leading-relaxed" style="color:#777;">回答几个问题，发现你的专属风格基因，生成你的风格档案卡片。</p>
                <span class="entry-btn mt-5">开始测评 <span aria-hidden="true">→</span></span>
            </a>

            <a href="zhenduan.html" class="card block p-7 fade-up d3 no-underline" style="color:inherit;">
                <span class="entry-tag mb-4">诊断 · DIAGNOSIS</span>
                <h2 class="text-lg font-semibold mt-3">穿搭诊断</h2>
                <p class="text-sm mt-2 leading-relaxed" style="color:#777;">审视你现在的穿搭，看看你的风格是否真正适合你。</p>
                <span class="entry-btn mt-5">开始诊断 <span aria-hidden="true">→</span></span>
            </a>
        </div>
    </div>
</body>
</html>
